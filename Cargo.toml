[workspace]
members = [
    "apps/cli",
    "crates/core",
    "crates/platform",
    "crates/providers",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Mickyj70/nummetria"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5.47", features = ["derive"] }
csv = "1"
directories = "6"
keyring = { version = "3.6.3", default-features = false }
nummetria-core = { path = "crates/core" }
nummetria-platform = { path = "crates/platform" }
nummetria-providers = { path = "crates/providers" }
nummetria-storage = { path = "crates/storage" }
rust_decimal = { version = "1", default-features = false, features = ["serde-with-str", "std"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
zeroize = "1"
