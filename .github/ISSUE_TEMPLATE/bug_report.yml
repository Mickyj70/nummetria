name: Bug report
description: Report reproducible behavior that is incorrect or unsafe.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nummetria. Never include real credentials,
        prompts, responses, or unsanitized provider data.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets and sensitive usage data.
          required: true
  - type: input
    attributes:
      label: Nummetria version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other or unsupported
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Use fake credentials and the smallest sanitized example possible.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized diagnostic output
      description: Add `nummetria doctor` output only after checking it for sensitive data.
      render: shell
